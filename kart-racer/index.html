<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#77b7e7" />
  <title>Adaptive Kart Racer</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(14, 20, 28, .78);
      --panel-2: rgba(24, 32, 42, .9);
      --border: rgba(255,255,255,.22);
      --text: #fff;
      --accent: #3985ff;
      --accent-soft: rgba(57,133,255,.24);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#111; color:var(--text); }
    button { font:inherit; color:inherit; user-select:none; touch-action:none; }
    #game { position:relative; width:100%; height:100%; overflow:hidden; background:#80bde8; touch-action:none; }
    #game canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
    .glass { background:var(--panel); border:1px solid var(--border); backdrop-filter:blur(6px); }
    #loading { position:absolute; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:#7cb9e6; font-weight:700; }
    #rankBox { position:absolute; z-index:20; left:max(10px,env(safe-area-inset-left)); top:max(10px,env(safe-area-inset-top)); width:118px; padding:8px; border-radius:13px; font-size:13px; }
    #rankHead { display:flex; justify-content:space-between; padding-bottom:6px; margin-bottom:6px; border-bottom:1px solid var(--border); font-weight:700; }
    #ranking { display:grid; gap:4px; }
    .rank-row { display:grid; grid-template-columns:18px 1fr; align-items:center; gap:4px; min-width:0; padding:4px 5px; border:1px solid var(--border); border-radius:7px; background:rgba(255,255,255,.035); }
    .rank-row.me { background:var(--accent-soft); font-weight:750; }
    .rank-row span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #lapText, #learnText { margin-top:6px; padding-top:5px; border-top:1px solid var(--border); text-align:center; }
    #learnText { margin-top:4px; padding-top:4px; font-size:11px; opacity:.82; }
    #driftHud { position:absolute; z-index:20; left:50%; top:max(12px,env(safe-area-inset-top)); transform:translateX(-50%); width:min(190px,38vw); text-align:center; font-size:12px; }
    #driftHead { display:flex; justify-content:space-between; gap:8px; margin-bottom:4px; text-shadow:0 1px 3px #000; }
    #boostTrack { height:8px; overflow:hidden; border-radius:999px; border:1px solid var(--border); background:rgba(0,0,0,.25); }
    #boostBar { width:0%; height:100%; background:var(--accent); transition:width .08s linear; }
    #boostText { margin-top:3px; text-shadow:0 1px 3px #000; }
    #speedHud { position:absolute; z-index:20; left:50%; bottom:max(16px,env(safe-area-inset-bottom)); transform:translateX(-50%); text-align:center; pointer-events:none; text-shadow:0 2px 6px rgba(0,0,0,.7); }
    #speed { font-size:clamp(38px,8vw,64px); line-height:.9; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-2px; }
    #speedUnit { margin-top:4px; font-size:12px; font-weight:650; }
    #steerControls { position:absolute; z-index:30; left:max(14px,env(safe-area-inset-left)); bottom:max(90px,env(safe-area-inset-bottom) + 90px); display:flex; gap:10px; }
    #actionControls { position:absolute; z-index:30; right:max(14px,env(safe-area-inset-right)); bottom:max(12px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; gap:8px; }
    .round { border:1px solid var(--border); background:var(--panel-2); display:flex; align-items:center; justify-content:center; box-shadow:0 3px 12px rgba(0,0,0,.24); }
    .round:active, .round.pressed { transform:scale(.94); filter:brightness(1.15); }
    .steer { width:clamp(72px,17vw,88px); height:clamp(72px,17vw,88px); border-radius:0; clip-path:polygon(0 0,100% 50%,0 100%); font-size:0; font-weight:800; }
    #leftBtn { clip-path:polygon(100% 0,0 50%,100% 100%); }
    #rightBtn { clip-path:polygon(0 0,100% 50%,0 100%); }
    #driftBtn { width:80px; height:80px; border-radius:50%; background:var(--accent); font-size:13px; font-weight:800; }
    #brakeBtn { width:46px; height:46px; border-radius:50%; }
    #brakeBtn svg { width:25px; height:25px; }
    #tip { position:absolute; z-index:15; left:50%; bottom:88px; transform:translateX(-50%); font-size:10px; opacity:.7; white-space:nowrap; pointer-events:none; text-shadow:0 1px 3px #000; }
    @media (max-width:520px) {
      #rankBox { width:102px; font-size:11px; }
      #driftBtn { width:74px; height:74px; }
      #tip { display:none; }
    }
  </style>
</head>
<body>
  <main id="game">
    <div id="loading">3D 차량과 트랙을 불러오는 중…</div>

    <section id="rankBox" class="glass" aria-label="순위">
      <div id="rankHead"><span>RANK</span><span><strong id="rank">1</strong>/6</span></div>
      <div id="ranking"></div>
      <div id="lapText">LAP <strong id="lap">1</strong>/3</div>
      <div id="learnText">AI LEARN <strong id="learnCount">0</strong></div>
    </section>

    <section id="driftHud" aria-label="드리프트 및 부스터">
      <div id="driftHead"><span id="driftState">NORMAL</span><span id="driftAngle">0°</span></div>
      <div id="boostTrack"><div id="boostBar"></div></div>
      <div id="boostText">BOOST 0%</div>
    </section>

    <section id="speedHud" aria-label="속도">
      <div id="speed">0</div>
      <div id="speedUnit">km/h</div>
    </section>

    <div id="steerControls">
      <button id="leftBtn" type="button" class="round steer" aria-label="왼쪽 조향"></button>
      <button id="rightBtn" type="button" class="round steer" aria-label="오른쪽 조향"></button>
    </div>

    <div id="actionControls">
      <button id="driftBtn" type="button" class="round" aria-label="드리프트">DRIFT</button>
      <button id="brakeBtn" type="button" class="round" aria-label="브레이크 및 후진">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 3v7M11 9h10l3 13c.4 1.7-.8 3-2.5 3h-11C8.8 25 7.6 23.7 8 22l3-13Z" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M11 16h10M10 20h12" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
    </div>

    <div id="tip">← → 조향 · Space 드리프트 · ↓ 브레이크/후진</div>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
